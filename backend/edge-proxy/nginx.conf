# Point d'entrée public UNIQUE du backend (port 8000, comme avant).
# But : garder un seul port à gérer côté VPS/HTTPS externe, alors que deux
# services distincts doivent maintenant répondre — le gateway (HTTP normal)
# et messaging-service (WebSocket temps réel, qu'un proxy HTTP classique ne
# sait pas relayer). Cette nginx fait juste l'aiguillage par chemin :
#   - /socket.io/*  -> messaging-service (upgrade WebSocket géré)
#   - /api/*        -> gateway (préfixe retiré avant de transmettre)
#   - tout le reste -> gateway (compatibilité avec les anciens appels
#                       directs par IP:8000 sans préfixe /api, ex.
#                       d'anciens builds frontend pas encore migrés)
#
# Pourquoi /api : en production, le frontend et l'API partagent maintenant
# le même nom de domaine (https://mboatrip.duckdns.org) pour éviter tout
# problème de CORS et de contenu mixte HTTPS/HTTP. Sans préfixe dédié, une
# page frontend et une route API peuvent porter le même chemin (ex.
# /itineraries existe des deux côtés) — le reverse proxy externe ne saurait
# alors pas lequel des deux services doit répondre. Avec /api, la règle
# devient simple et sans ambiguïté : voir backend/README.md pour la config
# exacte à mettre côté reverse proxy externe du VPS (hors de ce projet).

server {
    listen 8000;
    server_name _;

    client_max_body_size 30m;

    location /socket.io/ {
        proxy_pass http://messaging-service:5005/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

